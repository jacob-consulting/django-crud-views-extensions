[project]
name = "django-crud-views-extensions"
version = "0.3.3"
description = "Incubator for django-crud-views extension apps (widgets, fields)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
    "Intended Audience :: Developers",
    "Framework :: Django",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "django-crud-views>=0.29.0",
]

[project.urls]
Homepage = "https://github.com/jacob-consulting/django-crud-views-extensions"
Documentation = "https://django-crud-views-extensions.readthedocs.io/en/latest/"
Repository = "https://github.com/jacob-consulting/django-crud-views-extensions.git"
Issues = "https://github.com/jacob-consulting/django-crud-views-extensions/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "pytest-mock",
    "django-pipeline",
    "pytest-cov",
    "ruff",
    "bump-my-version",
    "pygments",  # example app: "The code behind this page"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crud_views_widget_datetimepicker", "src/crud_views_widget_typeahead"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["crud_views_widget_datetimepicker", "crud_views_widget_typeahead"]

[tool.bumpversion]
current_version = "0.3.3"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
